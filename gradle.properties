# Memoria de la máquina virtual de Gradle y codificación de los archivos fuente.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX es obligatorio en cualquier proyecto Android actual.
android.useAndroidX=true

# La carpeta del proyecto contiene una 'ò' («Apps Mòbil»). AGP bloquea por defecto cualquier
# ruta con caracteres no ASCII, aunque las herramientas actuales (build-tools 36.0.0) sí las
# admiten. Se desactiva esa comprobación en lugar de mover el repositorio de sitio.
# Ver http://b.android.com/95744
android.overridePathCheck=true

# Cada módulo solo ve su propia clase R, lo que acelera la compilación.
android.nonTransitiveRClass=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official
