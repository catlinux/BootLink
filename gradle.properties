# Memoria de la máquina virtual de Gradle.
#
# No se fija aquí -Dfile.encoding=UTF-8 a propósito: con esa opción el demonio de Gradle escribe en
# UTF-8 el archivo temporal que lleva la ruta de clases de los procesos de prueba, y el lanzador de
# Java 17 lo lee con la codificación ANSI de Windows. La 'ò' de la carpeta del proyecto («Apps
# Mòbil») se corrompe por el camino y las pruebas fallan con ClassNotFoundException. Los archivos
# fuente se siguen leyendo en UTF-8, que es lo que usan por defecto Kotlin, javac y AGP.
org.gradle.jvmargs=-Xmx2048m

# AndroidX es obligatorio en cualquier proyecto Android actual.
android.useAndroidX=true

# La carpeta del proyecto contiene una 'ò' («Apps Mòbil»). AGP bloquea por defecto cualquier
# ruta con caracteres no ASCII, aunque las herramientas actuales (build-tools 36.0.0) sí las
# admiten. Se desactiva esa comprobación en lugar de mover el repositorio de sitio.
# Ver http://b.android.com/95744
android.overridePathCheck=true

# Cada módulo solo ve su propia clase R, lo que acelera la compilación.
android.nonTransitiveRClass=true

# Estilo de código oficial de Kotlin.
kotlin.code.style=official
